    <title>Tabuada</title>

<body>
    <div id="title">Tabuada</div>
     
    <form class="form">

            <input type="number" id="valorUsuario">
        </div>

       <div class="form__comeco">
        <p class="comeco__tabuada">Onde começa a tabuada?</p>
        <input type="number" id="comecoTabuada">
       </div>

       <div class="form__limite">
        <p class="limite__tabuada">Onde termina a tabuada?</p>
        <input type="nunber" id="limiteTabuada">
       </div>
       
    </form>
